<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rock Studio Reservation</title>

<link href="../dist/output.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">

<style>
body{font-family:'Inter',sans-serif;}
.error-text{color:#f87171;font-size:12px;margin-top:4px}
</style>

</head>

<body class="bg-gradient-to-br from-black via-zinc-900 to-red-950 min-h-screen flex justify-center p-6 text-white">

<div class="w-full max-w-6xl flex flex-col gap-8">

<!-- HEADER -->
<div class="text-center">
<h1 class="text-3xl md:text-4xl font-bold text-red-500 tracking-wide">
ROCK STUDIO
</h1>
<p class="text-gray-400 text-sm">Reservation System</p>
</div>

<!-- FORM -->
<div class="bg-zinc-900 rounded-2xl border border-red-900 shadow-xl overflow-hidden">

<div class="bg-gradient-to-r from-red-900 to-red-600 px-6 py-5">
<h2 class="text-xl font-bold">Form Reservasi</h2>
</div>

<form id="bookingForm" class="p-6 space-y-6" onsubmit="return tambahReservasi(event)">

<div class="grid sm:grid-cols-2 gap-5">

<div>
<label class="text-sm text-gray-300">Nama lengkap *</label>
<input id="nama" required
class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white focus:ring-2 focus:ring-red-600">
<p id="errorNama" class="error-text"></p>
</div>

<div>
<label class="text-sm text-gray-300">No Telepon *</label>
<input id="telp" required
class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white focus:ring-2 focus:ring-red-600">
<p id="errorTelp" class="error-text"></p>
</div>

<div>
<label class="text-sm text-gray-300">Nama Band</label>
<input id="band"
class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white">
</div>

<div>
<label class="text-sm text-gray-300">Ruang *</label>
<select id="ruang" required
class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white">
<option value="">Pilih</option>
<option>Studio A</option>
<option>Studio B</option>
</select>
</div>

<div>
<label class="text-sm text-gray-300">Tanggal *</label>
<input type="date" id="tanggal"
class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white">
</div>

<div>
<label class="text-sm text-gray-300">Jam *</label>
<input type="time" id="jam"
class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white">
</div>

</div>

<div>
<label class="text-sm text-gray-300">Permintaan khusus</label>
<textarea id="catatan"
class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white"></textarea>
</div>

<button class="w-full bg-red-700 hover:bg-red-800 active:scale-95 transition py-3 rounded-xl font-bold shadow-lg">
🔥 Simpan Reservasi
</button>

</form>
</div>

<!-- TABLE -->
<div class="bg-zinc-900 rounded-2xl border border-red-900 shadow-xl p-4">

<h3 class="text-lg font-semibold text-red-400 mb-4">Daftar Reservasi</h3>

<table class="w-full text-sm">
<thead>
<tr class="text-red-400 border-b border-zinc-700">
<th class="p-2">Nama</th>
<th class="p-2">Telp</th>
<th class="p-2">Band</th>
<th class="p-2">Ruang</th>
<th class="p-2">Tanggal</th>
<th class="p-2">Jam (WIB)</th>
<th class="p-2">Request</th>
<th class="p-2">Aksi</th>
</tr>
</thead>

<tbody id="tabelBodi"></tbody>

</table>

</div>

</div>

<script>

let daftarReservasi=[];
let editIndex=null;

// ambil semua element sekali saja (BEST PRACTICE)
const namaInput = document.getElementById("nama");
const telpInput = document.getElementById("telp");
const bandInput = document.getElementById("band");
const ruangInput = document.getElementById("ruang");
const tanggalInput = document.getElementById("tanggal");
const jamInput = document.getElementById("jam");
const catatanInput = document.getElementById("catatan");

const errorNama = document.getElementById("errorNama");
const errorTelp = document.getElementById("errorTelp");

function validasi(){
let valid=true;

// validasi nama
if(!/^[a-zA-Z\s]+$/.test(namaInput.value)){
errorNama.innerText="Nama hanya huruf";
valid=false;
}else errorNama.innerText="";

// validasi telepon
if(!/^[0-9]+$/.test(telpInput.value)){
errorTelp.innerText="Telepon hanya angka";
valid=false;
}else errorTelp.innerText="";

return valid;
}

// format WIB
function formatWIB(jam){
if(!jam) return "-";
return jam + " WIB";
}

function renderTabel(){
const tbody = document.getElementById("tabelBodi");
let html="";

if(daftarReservasi.length===0){
html=`<tr><td colspan="8" class="text-center p-4 text-gray-400">Belum ada data</td></tr>`;
}

daftarReservasi.forEach((d,i)=>{
html+=`
<tr class="border-b border-zinc-800 hover:bg-red-900/20">
<td class="p-2">${d.nama}</td>
<td class="p-2">${d.telp}</td>
<td class="p-2">${d.band || "-"}</td>
<td class="p-2">${d.ruang}</td>
<td class="p-2">${d.tanggal}</td>
<td class="p-2">${formatWIB(d.jam)}</td>
<td class="p-2">${d.catatan || "-"}</td>
<td class="p-2 flex gap-2">
<button onclick="editReservasi(${i})"
class="bg-yellow-500 px-2 py-1 text-xs rounded">Edit</button>
<button onclick="hapusReservasi(${i})"
class="bg-red-700 px-2 py-1 text-xs rounded">Hapus</button>
</td>
</tr>`;
});

tbody.innerHTML=html;
}

function tambahReservasi(e){
e.preventDefault();

if(!validasi()) return false;

const data={
nama: namaInput.value,
telp: telpInput.value,
band: bandInput.value,
ruang: ruangInput.value,
tanggal: tanggalInput.value,
jam: jamInput.value,
catatan: catatanInput.value
};

if(editIndex===null){
daftarReservasi.push(data);
}else{
daftarReservasi[editIndex]=data;
editIndex=null;
}

document.getElementById("bookingForm").reset();
renderTabel();

return false;
}

function editReservasi(i){
let d=daftarReservasi[i];

namaInput.value=d.nama;
telpInput.value=d.telp;
bandInput.value=d.band;
ruangInput.value=d.ruang;
tanggalInput.value=d.tanggal;
jamInput.value=d.jam;
catatanInput.value=d.catatan;

editIndex=i;

window.scrollTo({top:0,behavior:"smooth"});
}

function hapusReservasi(i){
daftarReservasi.splice(i,1);
renderTabel();
}

window.onload=renderTabel;

</script>

</body>
</html>
