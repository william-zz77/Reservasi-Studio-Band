<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rock Studio Reservation</title>

<link href="dist/output.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">

<style>
body{font-family:'Inter',sans-serif;}
.error-text{color:#f87171;font-size:12px;margin-top:4px}
</style>
</head>

<body class="bg-gradient-to-br from-black via-zinc-900 to-red-950 min-h-screen flex justify-center p-6 text-white">

<div class="w-full max-w-6xl space-y-8">

<h1 class="text-3xl font-bold text-red-500">ROCK STUDIO</h1>

<!-- FORM -->
<form id="bookingForm" class="p-6 space-y-6">

<div class="grid sm:grid-cols-2 gap-5">

<input id="nama" required placeholder="Nama"
class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl">

<input id="telp" required placeholder="No Telepon"
class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl">

<input id="band" placeholder="Nama Band"
class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl">

<select id="ruang" required class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl">
<option value="">Pilih Ruang</option>
<option>Studio A</option>
<option>Studio B</option>
</select>

<input type="date" id="tanggal" required
class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl">

<input type="time" id="jam" required
class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl">

</div>

<textarea id="catatan" placeholder="Catatan"
class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl"></textarea>

<button type="submit"
class="w-full bg-red-600 py-3 rounded-xl font-bold">
Simpan Reservasi
</button>

</form>

<!-- TABLE -->
<table class="w-full text-sm mt-6">
<thead>
<tr>
<th>Nama</th>
<th>Telp</th>
<th>Band</th>
<th>Ruang</th>
<th>Tanggal</th>
<th>Jam</th>
<th>Catatan</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabelBodi"></tbody>
</table>

</div>

<script>
const form = document.getElementById("bookingForm");
const tabel = document.getElementById("tabelBodi");

let dataReservasi = JSON.parse(localStorage.getItem("reservasi")) || [];
let editIndex = null;

// ================== RENDER ==================
function renderTable(){
    tabel.innerHTML = "";
    dataReservasi.forEach((data, index) => {
        tabel.innerHTML += `
        <tr>
            <td>${data.nama}</td>
            <td>${data.telp}</td>
            <td>${data.band}</td>
            <td>${data.ruang}</td>
            <td>${data.tanggal}</td>
            <td>${data.jam}</td>
            <td>${data.catatan}</td>
            <td>
                <button onclick="editData(${index})" class="text-blue-400">Edit</button>
                |
                <button onclick="hapusData(${index})" class="text-red-400">Hapus</button>
            </td>
        </tr>`;
    });
}

// ================== CREATE & UPDATE ==================
form.addEventListener("submit", function(e){
    e.preventDefault();

    const reservasi = {
        nama: document.getElementById("nama").value,
        telp: document.getElementById("telp").value,
        band: document.getElementById("band").value,
        ruang: document.getElementById("ruang").value,
        tanggal: document.getElementById("tanggal").value,
        jam: document.getElementById("jam").value,
        catatan: document.getElementById("catatan").value
    };

    if(editIndex === null){
        dataReservasi.push(reservasi); // CREATE
    } else {
        dataReservasi[editIndex] = reservasi; // UPDATE
        editIndex = null;
    }

    localStorage.setItem("reservasi", JSON.stringify(dataReservasi));
    form.reset();
    renderTable();
});

// ================== EDIT ==================
function editData(index){
    const data = dataReservasi[index];

    document.getElementById("nama").value = data.nama;
    document.getElementById("telp").value = data.telp;
    document.getElementById("band").value = data.band;
    document.getElementById("ruang").value = data.ruang;
    document.getElementById("tanggal").value = data.tanggal;
    document.getElementById("jam").value = data.jam;
    document.getElementById("catatan").value = data.catatan;

    editIndex = index;
}

// ================== DELETE ==================
function hapusData(index){
    if(confirm("Yakin ingin menghapus data?")){
        dataReservasi.splice(index, 1);
        localStorage.setItem("reservasi", JSON.stringify(dataReservasi));
        renderTable();
    }
}

// ================== LOAD ==================
renderTable();
</script>

</body>
</html>
