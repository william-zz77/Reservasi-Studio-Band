<script>
const form = document.getElementById("bookingForm");
const tabel = document.getElementById("tabelBodi");

let dataReservasi = JSON.parse(localStorage.getItem("reservasi")) || [];
let editIndex = null;

// ================== RENDER ==================
function renderTable(){
    tabel.innerHTML = "";
    dataReservasi.forEach((data, index) => {
        tabel.innerHTML += `
        <tr>
            <td>${data.nama}</td>
            <td>${data.telp}</td>
            <td>${data.band}</td>
            <td>${data.ruang}</td>
            <td>${data.tanggal}</td>
            <td>${data.jam}</td>
            <td>${data.catatan}</td>
            <td>
                <button onclick="editData(${index})" class="text-blue-400">Edit</button>
                |
                <button onclick="hapusData(${index})" class="text-red-400">Hapus</button>
            </td>
        </tr>`;
    });
}

// ================== CREATE & UPDATE ==================
form.addEventListener("submit", function(e){
    e.preventDefault();

    const reservasi = {
        nama: document.getElementById("nama").value,
        telp: document.getElementById("telp").value,
        band: document.getElementById("band").value,
        ruang: document.getElementById("ruang").value,
        tanggal: document.getElementById("tanggal").value,
        jam: document.getElementById("jam").value,
        catatan: document.getElementById("catatan").value
    };

    if(editIndex === null){
        // CREATE
        dataReservasi.push(reservasi);
    } else {
        // UPDATE
        dataReservasi[editIndex] = reservasi;
        editIndex = null;
    }

    localStorage.setItem("reservasi", JSON.stringify(dataReservasi));
    form.reset();
    renderTable();
});

// ================== EDIT ==================
function editData(index){
    const data = dataReservasi[index];

    document.getElementById("nama").value = data.nama;
    document.getElementById("telp").value = data.telp;
    document.getElementById("band").value = data.band;
    document.getElementById("ruang").value = data.ruang;
    document.getElementById("tanggal").value = data.tanggal;
    document.getElementById("jam").value = data.jam;
    document.getElementById("catatan").value = data.catatan;

    editIndex = index;
}

// ================== DELETE ==================
function hapusData(index){
    if(confirm("Yakin ingin menghapus data?")){
        dataReservasi.splice(index, 1);
        localStorage.setItem("reservasi", JSON.stringify(dataReservasi));
        renderTable();
    }
}

// ================== LOAD ==================
renderTable();
</script>
