<!-- SCRIPT -->
<script>
function tambahReservasi(event) {
    event.preventDefault();

    const nama = document.getElementById("nama").value;
    const telp = document.getElementById("telp").value;
    const band = document.getElementById("band").value;
    const ruang = document.getElementById("ruang").value;
    const tanggal = document.getElementById("tanggal").value;
    const jam = document.getElementById("jam").value;
    const catatan = document.getElementById("catatan").value;

    if (!nama || !telp || !ruang || !tanggal || !jam) {
        alert("Isi semua field wajib!");
        return false;
    }

    const tabel = document.getElementById("tabelBodi");

    const row = `
    <tr class="border-b border-zinc-700">
        <td class="p-2">${nama}</td>
        <td class="p-2">${telp}</td>
        <td class="p-2">${band}</td>
        <td class="p-2">${ruang}</td>
        <td class="p-2">${tanggal}</td>
        <td class="p-2">${jam}</td>
        <td class="p-2">${catatan}</td>
        <td class="p-2 text-red-400 cursor-pointer" onclick="hapusRow(this)">Hapus</td>
    </tr>
    `;

    tabel.innerHTML += row;

    document.getElementById("bookingForm").reset();

    return false;
}

function hapusRow(btn) {
    btn.parentElement.parentElement.remove();
}
</script>
